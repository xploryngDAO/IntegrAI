# Stack de produção-like do SAC Hub: API (imagem com migrações), PostgreSQL e
# Redis. O object storage é externo e compatível com S3 (AWS S3, MinIO, R2,
# s3rver...): aponte S3_ENDPOINT/S3_* no .env.prod.
#
# Uso:
#   cp .env.prod.example .env.prod   # preencha os segredos
#   docker build -f packages/server/Dockerfile -t sac-hub-api:prod .
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
#   DATABASE_URL=postgresql://sac:<senha>@127.0.0.1:55433/sac_hub \
#     ADMIN_EMAIL=... ADMIN_PASSWORD=... npm run db:seed
#
# Web (Vercel) continua separado; aponte VITE_API_BASE_URL para a API publicada.
name: sac-hub-prod

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-sac_hub}
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-55433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sac} -d ${POSTGRES_DB:-sac_hub}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-56380}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: sac-hub-api:prod
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:${API_HOST_PORT:-4105}:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-sac}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sac_hub}?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      S3_ENDPOINT: ${S3_ENDPOINT:?defina S3_ENDPOINT no .env.prod}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-sac-hub-raw}
      S3_ATTACHMENTS_BUCKET: ${S3_ATTACHMENTS_BUCKET:-sac-hub-attachments}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?defina S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?defina S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      JWT_EXPIRES_IN: 1h
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?defina ENCRYPTION_MASTER_KEY}
      ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:-prod-v1}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:${API_HOST_PORT:-4105}}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:${WEB_HOST_PORT:-8080}}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      RATE_LIMIT_GLOBAL_PER_MINUTE: ${RATE_LIMIT_GLOBAL_PER_MINUTE:-1800}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      GIT_SHA: ${GIT_SHA:-}
      LOG_LEVEL: info
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # SPA + reverse proxy same-origin (`/api`, `/socket.io`, `/webhooks`) for the
  # API container. This makes the stack self-hosted: no Vercel/CORS dependency.
  web:
    image: sac-hub-web:prod
    pull_policy: never
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:${WEB_HOST_PORT:-8080}:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  # HTTPS automático (Let's Encrypt) na frente do serviço web.
  # Opcional: docker compose ... --profile tls up -d  (exige DOMAIN + DNS + portas 80/443)
  caddy:
    image: caddy:2-alpine
    profiles: ['tls']
    depends_on:
      web:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN no .env.prod para o perfil tls}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    restart: unless-stopped

  # Monitoramento opcional: docker compose ... --profile observability up -d
  # Requer deploy/observability/METRICS_TOKEN (token, somente leitura).
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ['observability']
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./deploy/observability/METRICS_TOKEN:/etc/prometheus/METRICS_TOKEN:ro
      - prometheusdata:/prometheus
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ['observability']
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - '${GRAFANA_PORT:-3000}:3000'
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
  prometheusdata:
  grafanadata:
