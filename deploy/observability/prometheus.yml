global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: sachub-api
    metrics_path: /api/v1/metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/METRICS_TOKEN
    static_configs:
      - targets: ['api:4000']
        labels:
          service: sachub-api

  - job_name: caddy
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ['caddy:2019']
        labels:
          service: caddy
