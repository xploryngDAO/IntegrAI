name: sac-hub

x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-production}
  PORT: "4000"
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:4000}
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
  DATABASE_URL: postgresql://sac:sac@postgres:5432/sac_hub?schema=public&connection_limit=20
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-sac-hub-raw}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
  S3_FORCE_PATH_STYLE: "true"
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_SECURE: "false"
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-please-32-chars-min}
  ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-zJ8kQ2mWv7bT1yN5cR9pLx4hF6dA0gU3sE2iO8qK5wY=}
  ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:-local-dev-v1}
  AMAZON_LWA_CLIENT_ID: ${AMAZON_LWA_CLIENT_ID:-}
  AMAZON_LWA_CLIENT_SECRET: ${AMAZON_LWA_CLIENT_SECRET:-}
  AMAZON_SES_INBOUND_SHARED_SECRET: ${AMAZON_SES_INBOUND_SHARED_SECRET:-}
  MELI_CLIENT_ID: ${MELI_CLIENT_ID:-}
  MELI_CLIENT_SECRET: ${MELI_CLIENT_SECRET:-}
  MELI_REDIRECT_URI: ${MELI_REDIRECT_URI:-http://localhost:4000/api/v1/accounts/oauth/mercadolivre/callback}
  SHOPEE_PARTNER_ID: ${SHOPEE_PARTNER_ID:-}
  SHOPEE_PARTNER_KEY: ${SHOPEE_PARTNER_KEY:-}
  SHOPEE_REDIRECT_URI: ${SHOPEE_REDIRECT_URI:-http://localhost:4000/api/v1/accounts/oauth/shopee/callback}

services:
  postgres:
    image: postgres:16-alpine
    container_name: sac-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sac
      POSTGRES_PASSWORD: sac
      POSTGRES_DB: sac_hub
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sac -d sac_hub"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: sac-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--maxmemory-policy",
        "noeviction"
      ]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: sac-minio
    restart: unless-stopped
    # Optional S3-compatible object storage. Start with:
    #   docker compose --profile s3 up -d
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    container_name: sac-minio-init
    profiles: ["s3"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/sac-hub-raw &&
      mc mb --ignore-existing local/sac-hub-attachments &&
      mc anonymous set none local/sac-hub-raw &&
      echo 'minio buckets ready' && exit 0"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: sac-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  api:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    container_name: sac-api
    restart: unless-stopped
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_HOST_PORT:-4000}:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: sac-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_HOST_PORT:-8080}:80"

volumes:
  pgdata:
  redisdata:
  miniodata:



