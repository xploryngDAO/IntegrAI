version: 2

# Dependabot keeps the supply chain patched without flooding the repo:
# minor/patch updates are grouped (production and development separately) and
# majors require explicit review — CI (audit, OSV, semgrep, tests, builds) is the
# gate for every PR.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      production-patch-minor:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-patch-minor:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:10'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /packages/server
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
    schedule:
      interval: weekly
      day: monday
      time: '06:20'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /apps/web
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
