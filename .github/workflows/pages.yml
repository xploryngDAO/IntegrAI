name: Pages demo

# Publica o SPA no GitHub Pages como demo temporária enquanto a Vercel está
# limitada por cota. O backend continua no túnel/API configurado nas envs.

on:
  # Manual only: GitHub Pages must be enabled once in Settings → Pages →
  # Source "GitHub Actions" (the workflow token cannot enable it reliably).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - name: Build SPA for /IntegrAI/
        env:
          VITE_BASE_PATH: /IntegrAI/
          VITE_API_BASE_URL: https://growth-voters-independent-rca.trycloudflare.com/api/v1
          VITE_WS_URL: https://growth-voters-independent-rca.trycloudflare.com
        run: npm run build --workspace @sac/web
      - name: SPA fallback for Pages
        run: |
          cp apps/web/dist/index.html apps/web/dist/404.html
          touch apps/web/dist/.nojekyll
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
