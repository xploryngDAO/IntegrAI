name: Pages demo

# Publica o SPA no GitHub Pages (branch gh-pages) a cada push na main. O Pages
# está configurado como "Deploy from a branch" -> gh-pages; este workflow só
# mantém o branch com o bundle atual (o backend continua na API/túnel).
#
# Roda também manualmente (workflow_dispatch).

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Force-push do branch gh-pages exige contents: write.
permissions:
  contents: write

concurrency:
  group: pages-demo
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Endpoints públicos atuais. O SPA também lê runtime-config.json no boot;
      # estes valores são o fallback *bakeado* para o domínio do Pages.
      VITE_BASE_PATH: /IntegrAI/
      VITE_API_BASE_URL: https://growth-voters-independent-rca.trycloudflare.com/api/v1
      VITE_WS_URL: https://growth-voters-independent-rca.trycloudflare.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # O push do gh-pages roda no mesmo repositório.
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - name: Build SPA for /IntegrAI/
        run: npm run build --workspace @sac/web
      - name: SPA fallback for Pages
        run: |
          cp apps/web/dist/index.html apps/web/dist/404.html
          touch apps/web/dist/.nojekyll
      - name: Publish gh-pages branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/pages
          mkdir -p /tmp/pages
          cp -a apps/web/dist/. /tmp/pages/
          git checkout --orphan gh-pages
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/pages/. .
          git add -A -f
          if git diff --cached --quiet; then
            echo "gh-pages já está atualizado"
            exit 0
          fi
          git commit -m "deploy: SPA GitHub Pages (${GITHUB_SHA::7})"
          git push --force origin gh-pages
