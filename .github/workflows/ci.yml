name: CI

on:
  push:
    branches: [main]
  pull_request:

# Keep only the newest run per branch/PR: the matrix is deterministic and the
# free runner queue must not accumulate obsolete revisions.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the job only reads the repository.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Lint GitHub Actions workflows
        run: |
          curl -fsSLO https://github.com/rhysd/actionlint/releases/download/v1.7.11/actionlint_1.7.11_linux_amd64.tar.gz
          tar xzf actionlint_1.7.11_linux_amd64.tar.gz actionlint
          ./actionlint .github/workflows/*.yml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      # Prisma ORM 7 generates plain TypeScript into packages/server/src/generated
      # (gitignored, no longer generated into node_modules), so it must run before
      # any typecheck/test/build step.
      - run: npm run prisma:generate
      - run: npx tsc -p packages/server/tsconfig.json --noEmit
      - run: npx tsc -p apps/web/tsconfig.json --noEmit
      - run: npx vitest run
      - run: npm run build:server
      - run: npm run build --workspace @sac/web
      - name: Bundle size budget
        run: node scripts/check-bundle-size.mjs
      - name: Build production API image
        run: docker build -f packages/server/Dockerfile --build-arg GIT_SHA=${{ github.sha }} -t sac-hub-api:ci .
      - name: Build production web image
        run: docker build -f apps/web/Dockerfile -t sac-hub-web:ci .
      - name: Validate compose overlays
        run: |
          docker compose --env-file .env.prod.example -f docker-compose.prod.yml config --quiet
          DATABASE_URL='postgresql://u:p@db.example.com:5432/sac?schema=public' \
          REDIS_URL='rediss://default:p@redis.example.com:6379' \
          docker compose --env-file .env.prod.example -f docker-compose.prod.yml \
            -f docker-compose.managed.yml --profile tls config --quiet
      - name: Validate edge configs (Caddy/nginx)
        run: |
          docker run --rm -e DOMAIN=api.example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm --add-host api:127.0.0.1 --entrypoint nginx sac-hub-web:ci -t
      - name: Scan images for HIGH/CRITICAL CVEs
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress sac-hub-api:ci
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress sac-hub-web:ci
